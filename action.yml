name: 'Tremvok Docs'
description: 'Build an MkDocs site strictly and stage it for a GitHub Pages deploy — toolchain auto-detected.'
author: 'Magma Moose'

branding:
  icon: 'upload-cloud'
  color: 'green'

inputs:
  working-directory:
    description: 'Directory containing mkdocs.yml.'
    required: false
    default: '.'
  toolchain:
    description: >-
      How to install MkDocs: auto (default) | uv | pip. `auto` picks uv when a uv.lock is
      present, otherwise pip against `requirements`. Detection exists so a caller does not
      have to declare per-repo what is already visible in the repo.
    required: false
    default: 'auto'
  docs-group:
    description: 'uv dependency-group holding the docs tooling (uv toolchain only).'
    required: false
    default: 'docs'
  requirements:
    description: 'Requirements file pinning the docs build (pip toolchain only).'
    required: false
    default: 'docs/requirements.txt'
  python-version:
    description: 'Python version used to build the site.'
    required: false
    default: '3.12'
  strict:
    description: >-
      Build with `--strict`, so a broken internal link or a nav entry pointing at a missing
      file fails rather than publishing a site with holes in it.
    required: false
    default: 'true'
  site-dir:
    description: 'Directory the built site is written to.'
    required: false
    default: 'site'
  target:
    description: >-
      Where the built site goes: github-pages (default) | cloudflare-pages | none.

      github-pages stages a Pages artifact for actions/deploy-pages, which the CALLING
      workflow must run: a composite action cannot hold `pages: write` or declare an
      `environment:`. cloudflare-pages needs neither, so this action deploys it outright.
      none builds and stops, which is what a pull-request check wants.
    required: false
    default: 'github-pages'
  stage-pages:
    description: >-
      Deprecated alias for `target`. 'false' means target: none. Kept so existing callers
      keep working; prefer `target`.
    required: false
    default: ''
  cloudflare-project:
    description: >-
      Cloudflare Pages project name. Defaults to `<repo>-docs`. Created on first deploy
      if it does not already exist.
    required: false
    default: ''
  cloudflare-account-id:
    description: 'Cloudflare account id. Required for target: cloudflare-pages.'
    required: false
    default: ''
  cloudflare-api-token:
    description: >-
      Cloudflare API token with Pages:Edit. Required for target: cloudflare-pages.
      Pass a secret, never a literal.
    required: false
    default: ''
  cloudflare-branch:
    description: >-
      Branch Cloudflare records the deployment against. The project's production branch
      yields a production deploy; anything else is a preview. Defaults to the ref.
    required: false
    default: ''
  checkout:
    description: 'Run actions/checkout first. Set false if the caller already checked out.'
    required: false
    default: 'true'
  lint:
    description: >-
      Run the repo-shape checks (README budget and section order, licence agreement,
      link targets, Marketplace preflight, INHERIT clobber) before building. These are
      the rules nothing else covers; --strict already catches broken internal links.
    required: false
    default: 'true'
  profile:
    description: 'Repo profile for the shape checks: auto | action | service | spec.'
    required: false
    default: 'auto'
  readme-budget:
    description: 'Override the README line budget. 0 uses the profile default.'
    required: false
    default: '0'
  markdownlint:
    description: >-
      Run markdownlint-cli2 over docs/ and README.md when a markdownlint config is
      present. Runs here rather than under MegaLinter because MegaLinter's `security`
      flavor carries no markdown linter, and MARKDOWN_MARKDOWNLINT emits no SARIF, so it
      could never gate on net-new findings anyway. Node is preinstalled on GitHub
      runners, so this costs an npx download and nothing else.
    required: false
    default: 'true'

outputs:
  site-dir:
    description: 'Absolute path to the built site.'
    value: ${{ steps.build.outputs.site-dir }}
  toolchain:
    description: 'The toolchain actually used: uv or pip.'
    value: ${{ steps.detect.outputs.toolchain }}
  target:
    description: 'The deploy target actually used.'
    value: ${{ steps.detect.outputs.target }}
  page-url:
    description: >-
      Deployed URL. Set for cloudflare-pages; empty for github-pages, whose deploy the
      calling workflow owns.
    value: ${{ steps.cloudflare.outputs.page-url }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Detection rather than declaration: uv.lock in the tree is the fact, and a caller
    # restating it in config is one more thing that can disagree with the repo.
    - name: Detect toolchain
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED: ${{ inputs.toolchain }}
        REQUIREMENTS: ${{ inputs.requirements }}
        STAGE_PAGES: ${{ inputs.stage-pages }}
        TARGET: ${{ inputs.target }}
        CF_PROJECT: ${{ inputs.cloudflare-project }}
        CF_ACCOUNT: ${{ inputs.cloudflare-account-id }}
        CF_TOKEN: ${{ inputs.cloudflare-api-token }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail
        case "$REQUESTED" in
          uv|pip) resolved="$REQUESTED" ;;
          auto)
            if [ -f uv.lock ]; then resolved=uv
            elif [ -f "$REQUIREMENTS" ]; then resolved=pip
            else
              echo "::error::No uv.lock and no $REQUIREMENTS — cannot tell how to install MkDocs. Set toolchain: explicitly." >&2
              exit 1
            fi ;;
          *) echo "::error::toolchain must be auto, uv or pip (got '$REQUESTED')" >&2; exit 1 ;;
        esac
        if [ ! -f mkdocs.yml ]; then
          echo "::error::No mkdocs.yml in ${PWD} — nothing to build." >&2
          exit 1
        fi
        # `stage-pages: false` was the old way of saying "build only". Honour it so
        # existing callers keep working, but let an explicit `target` win.
        target="$TARGET"
        if [ "$STAGE_PAGES" = "false" ] && [ "$TARGET" = "github-pages" ]; then
          target=none
        fi
        case "$target" in
          github-pages|cloudflare-pages|none) : ;;
          *) echo "::error::target must be github-pages, cloudflare-pages or none (got '$target')" >&2; exit 1 ;;
        esac
        if [ "$target" = "cloudflare-pages" ]; then
          # Fail now, before a build burns two minutes, rather than at the deploy step.
          [ -n "$CF_ACCOUNT" ] || { echo "::error::target: cloudflare-pages needs cloudflare-account-id." >&2; exit 1; }
          [ -n "$CF_TOKEN" ] || { echo "::error::target: cloudflare-pages needs cloudflare-api-token." >&2; exit 1; }
          echo "cf-project=${CF_PROJECT:-${REPO_NAME}-docs}" >> "$GITHUB_OUTPUT"
        fi
        echo "toolchain=$resolved" >> "$GITHUB_OUTPUT"
        echo "target=$target" >> "$GITHUB_OUTPUT"
        if [ "$target" = "github-pages" ]; then
          echo "stage-pages=true" >> "$GITHUB_OUTPUT"
        else
          echo "stage-pages=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Toolchain: $resolved | target: $target" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up uv
      if: steps.detect.outputs.toolchain == 'uv'
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Python
      if: steps.detect.outputs.toolchain == 'pip'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.requirements }}

    # Installed as its own step so the lint below can import PyYAML, which arrives
    # transitively with MkDocs. Hand-rolling a YAML parser to avoid this would be a
    # worse trade than one extra step.
    - name: Install docs toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.detect.outputs.toolchain }}
        DOCS_GROUP: ${{ inputs.docs-group }}
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        set -euo pipefail
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv sync --group "$DOCS_GROUP"
        else
          pip install --disable-pip-version-check --quiet -r "$REQUIREMENTS"
        fi

    - name: Lint repo shape
      if: inputs.lint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.detect.outputs.toolchain }}
        SCRIPT: ${{ github.action_path }}/scripts/lint_docs.py
        PROFILE: ${{ inputs.profile }}
        BUDGET: ${{ inputs.readme-budget }}
      run: |
        set -euo pipefail
        args=(--root . --profile "$PROFILE" --readme-budget "$BUDGET" --github-annotations)
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync python "$SCRIPT" "${args[@]}"
        else
          python "$SCRIPT" "${args[@]}"
        fi

    - name: Lint markdown
      if: inputs.markdownlint == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOCS_DIR: docs
      run: |
        set -euo pipefail
        cfg=""
        for c in .markdownlint.jsonc .markdownlint.json .markdownlint.yaml .markdownlint.yml; do
          [ -f "$c" ] && { cfg="$c"; break; }
        done
        if [ -z "$cfg" ]; then
          echo "No markdownlint config found; skipping."
          exit 0
        fi
        npx --yes markdownlint-cli2 --config "$cfg" "$DOCS_DIR/**/*.md" "README.md"

    - name: Build site
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ steps.detect.outputs.toolchain }}
        SITE_DIR: ${{ inputs.site-dir }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        strict_flag=""
        [ "$STRICT" = "true" ] && strict_flag="--strict"
        if [ "$TOOLCHAIN" = "uv" ]; then
          uv run --no-sync mkdocs build $strict_flag --site-dir "$SITE_DIR"
        else
          mkdocs build $strict_flag --site-dir "$SITE_DIR"
        fi
        echo "site-dir=$(cd "$SITE_DIR" && pwd)" >> "$GITHUB_OUTPUT"

    # Cloudflare Pages needs no GitHub permissions and no `environment:`, so unlike the
    # GitHub Pages path the action owns the whole deploy rather than handing an artifact
    # back to the caller. That asymmetry is the reason `target` exists at all.
    - name: Deploy to Cloudflare Pages
      id: cloudflare
      if: steps.detect.outputs.target == 'cloudflare-pages'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        PROJECT: ${{ steps.detect.outputs.cf-project }}
        SITE_DIR: ${{ inputs.site-dir }}
        BRANCH: ${{ inputs.cloudflare-branch }}
      run: |
        set -euo pipefail
        branch="${BRANCH:-${GITHUB_REF_NAME:-main}}"
        # Idempotent by design: creating a project that already exists is not a failure
        # worth stopping for, and this is what lets a brand-new repo publish with no
        # manual Cloudflare setup at all.
        if ! npx --yes wrangler@4.20.0 pages project list 2>/dev/null | grep -Fxq "$PROJECT"; then
          echo "Creating Cloudflare Pages project $PROJECT"
          npx --yes wrangler@4.20.0 pages project create "$PROJECT" --production-branch main
        fi
        npx --yes wrangler@4.20.0 pages deploy "$SITE_DIR" \
          --project-name "$PROJECT" --branch "$branch" --commit-dirty=true \
          2>&1 | tee cf-deploy.log
        url=$(grep -oE 'https://[a-z0-9.-]+[.]pages[.]dev' cf-deploy.log | tail -1 || true)
        rm -f cf-deploy.log
        echo "page-url=$url" >> "$GITHUB_OUTPUT"
        echo "Deployed **$PROJECT** to ${url:-Cloudflare Pages}" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure Pages
      if: steps.detect.outputs.stage-pages == 'true'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Stage the Pages artifact
      if: steps.detect.outputs.stage-pages == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.site-dir }}
