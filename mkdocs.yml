site_name: Tremvok
site_description: One GitHub Action for the whole deploy side — docs, S3/CloudFront, Lambda, Terragrunt and Ansible, verified after the fact.
site_url: https://magmamoose.github.io/tremvok/
repo_url: https://github.com/MagmaMoose/tremvok
repo_name: MagmaMoose/tremvok
edit_uri: edit/main/docs/

theme:
  name: material
  # Peridot: the one common gem born in the mantle and carried to the surface by an eruption.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light green
      accent: light green
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light green
      accent: light green
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Setup: setup.md
  - Reference:
      # action-reference.md is GENERATED from action.yml by scripts/gen_action_reference.py,
      # including which target each input belongs to — read out of the same descriptions the
      # runtime validator's map is built from, so the page and the check cannot disagree.
      - Action: action-reference.md
      - API: api.md
  - Architecture: architecture.md
  - Migrating to v2: migration.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc: { permalink: true }
