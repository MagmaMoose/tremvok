# Tremvok's own CI. Four jobs, because the repository has three surfaces and one of them can
# only be proven by standing the whole stack up.
#
# All actions are SHA-pinned (Chargate's pre-commit hook enforces this org-wide); the trailing
# `# vX.Y.Z` comment tracks the tag each pinned SHA corresponds to.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: Action (shellcheck + bats)
    # The org's self-hosted pool, falling back to a GitHub-hosted runner for anyone who has no
    # pool. Not a preference: GitHub-hosted minutes are metered on private repositories, and
    # this workflow runs on every pull request.
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap bats and shellcheck
        # Fetched rather than installed from host packages: the self-hosted images are minimal
        # and have no sudo, and pinning the versions means a tool release cannot change what
        # this workflow enforces between a commit and its rebuild.
        shell: bash
        env:
          BATS_VERSION: '1.13.0'
          SHELLCHECK_VERSION: '0.11.0'
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          curl -fsSL --retry 3 "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            | tar -xz -C "$tmp"
          "${tmp}/bats-core-${BATS_VERSION}/install.sh" "${tmp}/bats"
          echo "${tmp}/bats/bin" >> "$GITHUB_PATH"

          if ! command -v shellcheck >/dev/null 2>&1; then
            arch="$(uname -m)"; [ "$arch" = "arm64" ] && arch=aarch64
            curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz" \
              | tar -xJ -C "$tmp"
            echo "${tmp}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          fi

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh terraform/localstack/*.sh

      - name: The action metadata parses, and every script it names exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          action = yaml.safe_load(pathlib.Path("action.yml").read_text())
          steps = action["runs"]["steps"]

          # A step referencing a script that does not exist is a runtime failure on somebody
          # else's deploy, and nothing else in CI would catch it.
          missing = []
          for step in steps:
              for name in re.findall(r"scripts/[A-Za-z0-9_.-]+\.sh", step.get("run", "")):
                  if not pathlib.Path(name).is_file():
                      missing.append(f'{step.get("name")}: {name}')
          if missing:
              sys.exit("action.yml names scripts that do not exist:\n  " + "\n  ".join(missing))

          # Every output must point at a step id that exists.
          ids = {s["id"] for s in steps if "id" in s}
          for key, spec in action.get("outputs", {}).items():
              for referenced in re.findall(r"steps\.([A-Za-z0-9_-]+)\.outputs", spec["value"]):
                  if referenced not in ids:
                      sys.exit(f"output {key} references unknown step id {referenced!r}")
          print(f"{len(action['inputs'])} inputs, {len(action['outputs'])} outputs, {len(steps)} steps")
          PY

      - name: bats
        run: bats tests/bats

      - name: Every script is executable and sources the shared library
        run: |
          set -euo pipefail
          rc=0
          for script in scripts/*.sh; do
            [ -x "$script" ] || { echo "::error::$script is not executable"; rc=1; }
            grep -q 'set -euo pipefail' "$script" || { echo "::error::$script does not set -euo pipefail"; rc=1; }
          done
          exit $rc

  api:
    name: API (ruff + mypy + pytest)
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

      - name: The package is self-contained
        # Unzipped into an empty directory and imported with that directory as the only source
        # of `tremvok`. An import the Lambda cannot satisfy otherwise deploys fine and 500s on
        # the first request.
        #
        # Built for the RUNNER's architecture, not the default. The package ships Linux wheels
        # for whichever architecture the function runs on, so an arm64 package cannot be
        # imported on an x86_64 runner — that is the trap working, not a failure. Determinism
        # and the cross-build itself are asserted by tests/test_build_api_zip.py, which reads
        # the archive rather than importing it and therefore works on any host.
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "aarch64" ] && arch=arm64
          python3 scripts/build_api_zip.py --arch "$arch" --out dist/native.zip
          rm -rf dist/unpacked && mkdir -p dist/unpacked
          unzip -q dist/native.zip -d dist/unpacked
          cd dist/unpacked
          PYTHONPATH=. python3 -c "import tremvok.aws.handler as h; assert h.handler; print('handler imports from the package alone')"

  terraform:
    name: Infrastructure (fmt + validate)
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - run: tofu fmt -check -recursive terraform/
      - run: make -C terraform validate

  stack:
    name: LocalStack (end to end)
    # `pool-amd64` rather than the default pool: this job runs Docker, and it is the pool the
    # org's other container-based job (Chargate/MegaLinter) already uses.
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER && 'pool-amd64' || 'ubuntu-latest' }}
    # The only job that proves the wiring: that the package imports on the function's
    # architecture, that the IAM policy permits what the code does, that the DynamoDB schema
    # matches the keys the code writes, and that Terraform and settings.py spell the
    # environment variables the same way.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - run: uv sync --all-groups --frozen

      # ARCH is derived from `uname -m`, so this runs x86_64 here and arm64 on a developer's
      # laptop — which is the point: the cross-architecture wheel trap is only visible when the
      # two agree, and only caught when something checks.
      - name: make dev
        run: make -C terraform dev

      - name: LocalStack logs on failure
        if: failure()
        run: docker logs tremvok-localstack 2>&1 | tail -100
