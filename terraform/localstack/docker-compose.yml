# LocalStack, community image. Everything this stack needs except API Gateway and a firing
# CloudWatch alarm is emulated for real — see the `localstack` variable in the module's
# variables.tf for exactly what a local run does and does not prove.
#
# `make -C terraform up` starts it; `make -C terraform smoke` drives it end to end.

services:
  localstack:
    image: localstack/localstack:4
    container_name: tremvok-localstack
    ports:
      - "4566:4566"
    environment:
      # Named explicitly rather than left to the default, so a service this stack starts
      # depending on fails at boot instead of at the first API call.
      #
      # `s3control` is here for a non-obvious reason: AWS provider v6 reads a bucket's tags
      # through the S3 Control API rather than the S3 API, so every `aws_s3_bucket` apply fails
      # with a 501 without it.
      SERVICES: "lambda,s3,s3control,dynamodb,ssm,kms,iam,sts,logs,cloudwatch,sns,apigateway"
      DEBUG: "0"
      # Lambda runs in sibling containers on the host daemon, which is why the socket is
      # mounted below. The alternative (LAMBDA_RUNTIME_EXECUTOR=local) skips the container and
      # with it the runtime's own import path — and the import path is exactly what a
      # cross-architecture wheel mismatch breaks, so the cheap executor would hide the bug this
      # harness most needs to catch.
      LAMBDA_RUNTIME_EXECUTOR: "docker"
      LAMBDA_REMOVE_CONTAINERS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]  # DevSkim: ignore DS162092
      interval: 5s
      timeout: 5s
      retries: 20
